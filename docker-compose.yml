services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dublacon}
      POSTGRES_USER: ${DB_USER:-dublacon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dublacon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8010
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5190:5173"
    depends_on:
      - backend

  sonarqube:
    image: sonarqube:community
    ports:
      - "9010:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
